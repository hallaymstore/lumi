<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f8b"><title>Lumi · Offline</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0d0b10;color:#fff;min-height:100vh;padding:24px;box-sizing:border-box}.wrap{max-width:760px;margin:auto}.card{background:#18131b;border:1px solid #2a202e;border-radius:26px;padding:24px;box-shadow:0 24px 70px #0008}.top{text-align:center}.dot{width:64px;height:64px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#ff4f8b,#8b5cf6);display:grid;place-items:center;font-size:30px}h1{margin:18px 0 8px}p{color:#b8adbc;line-height:1.55}button{border:0;border-radius:999px;padding:12px 20px;font-weight:700;background:#fff;color:#111;cursor:pointer}.cached{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.post{display:flex;gap:10px;padding:10px;border:1px solid #302536;border-radius:16px;color:#fff;text-decoration:none}.post img{width:68px;height:68px;object-fit:cover;border-radius:12px;background:#251c29}.post b,.post small{display:block}.post small{color:#ad9fb3;margin-top:4px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card top"><div class="dot">✦</div><h1>Internet uzildi</h1><p>Lumi shaxsiy feed, chat va settings ma’lumotlarini offline cache’da saqlamaydi. Quyida oldin yuklangan ommaviy trend previewlari bo‘lsa ko‘rsatiladi.</p><button onclick="location.reload()">Qayta urinish</button></section><section class="cached"><h2>Offline trendlar</h2><div class="grid" id="grid"><p>Cache tekshirilmoqda…</p></div></section></main><script>fetch('/api/public/trending-cache').then(r=>r.json()).then(d=>{const g=document.getElementById('grid');const p=(d.posts||[]).filter(x=>x.imageUrl).slice(0,8);g.innerHTML=p.length?p.map(x=>'<a class="post" href="/p/'+encodeURIComponent(x.id)+'"><img src="'+x.imageUrl.replace(/"/g,'&quot;')+'" alt=""><span><b>@'+String(x.author?.username||'creator').replace(/</g,'&lt;')+'</b><small>'+String(x.caption||'Lumi post').replace(/</g,'&lt;').slice(0,70)+'</small></span></a>').join(''):'<p>Hali offline trend cache yo‘q.</p>'}).catch(()=>{document.getElementById('grid').innerHTML='<p>Hali offline trend cache yo‘q.</p>'})</script></body></html>
